<script>
// 新しい版が出ていたら、古い部品を捨てて読み込み直す（更新してから最大10分、前の画面のままになるのを防ぐ）
(function () {
  if (!/github\.io$/.test(location.hostname)) return;
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
    if (!v || !v.v) return;
    var had = null; try { had = localStorage.getItem('grow-mgt-version'); } catch (e) { return; }
    if (had === v.v) return;
    var files = ['./', 'assets/style.css', 'app/app.js'].concat([].map.call(document.querySelectorAll('link[rel=modulepreload]'), function (l) { return l.getAttribute('href'); }).filter(function (h) { return h.indexOf('http') !== 0; }));
    Promise.all(files.map(function (f) { return fetch(f, { cache: 'reload' }).catch(function () {}); })).then(function () {
      try { localStorage.setItem('grow-mgt-version', v.v); } catch (e) {}
      location.reload(); // 新しい部品で開き直す（版を覚えたあとなので、くり返さない）
    });
  }).catch(function () {});
})();
</script>
<script type="module" src="app/app.js"></script>
